{% load i18n %}
<aside class="calendar-panel" aria-label="{% translate "Календарь повторения занятий" %}">
  <table class="calendar-table">
    <caption class="visually-hidden">{% translate "Дни повторения занятия по месяцам" %}</caption>
    <thead>
      <tr>
        {% for month in calendar.0 %}
          <th>{{ month }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for days in calendar.1 %}
        <tr>
          {% for day in days %}
            <td>{% if day %}{{ day }}{% endif %}</td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
</aside>
