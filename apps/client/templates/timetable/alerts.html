{% load i18n static %}
<section class="alerts" aria-label="{% translate "Объявления" %}">
  <div class="alert">
    <svg class="alert-icon"><use href="{% static 'icons/lucide.svg' %}#info"></use></svg>
    <div class="alert-text">
      <strong>{% translate "Расписание может изменяться." %}</strong>
      {% translate "Актуальную информацию уточняйте на официальном сайте университета." %}
    </div>
    <button class="icon-button alert-close" type="button" aria-label="{% translate "Закрыть объявление" %}">
      <svg class="icon"><use href="{% static 'icons/lucide.svg' %}#x"></use></svg>
    </button>
  </div>
</section>
