{% load i18n static %}
{% if alerts %}
  <section class="alerts" aria-label="{% translate "Announcements" %}">
    {% for alert in alerts %}
      <div
        class="alert alert--{{ alert.category }}"
        data-alert-id="{{ alert.pk }}"
        data-alert-dismissible="{{ alert.is_dismissible|yesno:'1,0' }}"
      >
        <i data-lucide="{{ alert.icon_name }}" class="alert-icon"></i>
        <div class="alert-text">
          <strong>{{ alert.display_title }}</strong>
          {{ alert.display_body|linebreaksbr }}
        </div>
        {% if alert.is_dismissible %}
          <button class="icon-button alert-close" type="button" aria-label="{% translate "Close announcement" %}">
            <i data-lucide="x" class="icon"></i>
          </button>
        {% endif %}
      </div>
    {% endfor %}
  </section>
{% endif %}
