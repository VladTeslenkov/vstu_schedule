{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления</title>
    <link rel="stylesheet" href="{% static 'timetable_update/style/panel.css' %}">
    <link rel="stylesheet" href="{% static 'timetable_update/style/admin_panel_style.css' %}">
</head>
<body class="panel-page login-page">
    <main class="login-shell">
        <section class="card login-card">
            <div class="card__header">
                <h1>Вход в панель управления</h1>
            </div>
            <div class="form-stack">
                {% if error %}
                <p class="form-error">{{ error }}</p>
                {% endif %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="field-group">
                        <label class="field-label" for="username">Имя пользователя</label>
                        <input class="field-input" type="text" id="username" name="username" required>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="password">Пароль</label>
                        <input class="field-input" type="password" id="password" name="password" required>
                    </div>
                    <button class="btn btn--primary btn--full" type="submit">Войти</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
