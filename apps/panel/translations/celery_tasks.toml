[ru.panel_tasks_update_timetable]
title = "Обновление расписания"
description = "Скачивает файлы расписания, сравнивает версии и сохраняет новые файлы в локальное хранилище."

[ru.panel_tasks_clear_storage]
title = "Очистка хранилища"
description = "Очищает выбранный компонент системы. Для ручного запуска нужны аргументы, поэтому задача отображается только для настройки и просмотра логов."

[en.panel_tasks_update_timetable]
title = "Timetable update"
description = "Downloads timetable files, compares versions and stores changed files locally."

[en.panel_tasks_clear_storage]
title = "Storage cleanup"
description = "Clears a selected system component. It requires arguments for manual runs, so it is shown for configuration and logs only."
