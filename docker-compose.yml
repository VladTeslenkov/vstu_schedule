services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    image: vstu_schedule:latest 
    # TODO: быстрый костыль. Загрузка больших, занимающих долгое время обработки, файлов может убить HTTP запрос
    command: gunicorn vstu_schedule.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --reload # в продакшене убрать --reload
    ports:
      - "8000:8000"
    volumes:
      # Поддерживает актуальность кода без пересборки образа, но не зависимости. УБРАТЬ В ПРОДАКШЕНЕ
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
      - ./logs:/app/logs
      - data_volume:/app/data
      # Скрыть .venv хоста внутри контейнера. УБРАТЬ В ПРОДАКШЕНЕ
      - /app/.venv
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: vstu_schedule:latest
    command: celery -A vstu_schedule worker -l info
    environment:
      - SERVICE_NAME=worker
    volumes:
      - data_volume:/app/data
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: vstu_schedule:latest
    environment:
      - SERVICE_NAME=beat
    command: celery -A vstu_schedule beat -l info -S django
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Опциональный фронт: docker compose --profile prod up — nginx на :80 перед приложением
  nginx:
    image: nginx:1.27-alpine
    restart: always
    profiles: 
      - full
    volumes:
      - ./.deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
  data_volume:
